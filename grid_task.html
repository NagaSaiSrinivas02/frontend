<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Task</title>
    <style>
        body{
            background-color: rgb(228, 190, 254);
        }
        .main{
            margin: 20px;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            justify-content: space-evenly;
            height: 100vh;
            gap: 15px;
        }
        .parent1,.parent2,.parent3,.parent4,
        .parent5,.parent6,.parent7,.parent7,
        .parent8,.parent9{
           height: 330px; 
           background-color: rgb(167, 165, 167);
           border: 5px solid rgb(96, 95, 95);
        }
        .parent1{
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 7px;
        }
        .parent1>*{
            background-color: aliceblue;
        }
        .parent2{
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 7px;
        }
        .parent2>*{
            background-color: aliceblue;
        }
        .parent2>.child1{
            grid-row: 1/3;
        }
        .parent3{
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 7px;
        }
        .parent3>*{
            background-color: aliceblue;
        }
        .parent4{
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 7px;
        }
        .parent4>*{
            background-color: aliceblue;
        }
        .parent4>.child1{
            grid-row: 1/2;
        }
        .parent4>.child2{
            grid-row: 1/3;
        }
        .parent4>.child3{
            grid-row: 1/2;
        }
        .parent4>.child4{
            grid-row: 2/4;
        }
        .parent4>.child5{
            grid-row: 3/4;
        }
        .parent4>.child6{
            grid-row: 2/4;
        }
        .parent5{
            display: grid;
            grid-template-columns: repeat(6,1fr);
            gap: 7px;
        }
        .parent5>*{
            background-color: aliceblue;
        }
        .parent5>.child1{
            grid-column: 1/4;
        }
        .parent5>.child2{
            grid-column: 4/7;
        }
        .parent5>.child3{
            grid-column: 1/3;
        }
        .parent5>.child4{
            grid-column: 3/5;
        }
        .parent5>.child5{
            grid-column: 5/7;
        }
        .parent6{
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 7px;
        }
        .parent6>*{
            background-color: aliceblue;
        }
        .parent6>.child1{
            grid-column: 1/3;
            grid-row: 1/3;
        }
        .parent7{
            display: grid;
            grid-template-columns: repeat(4,1fr);
            gap: 7px;
        }
        .parent7>*{
            background-color: aliceblue;
        }
        .parent7>.child1{
            grid-row: 1/5;
            grid-column: 1/3;
        }
        .parent7>.child2{
            grid-row: 1/3;
            grid-column: 3/5;
        }
        .parent7>.child5{
            grid-column: 4/5;
            grid-row: 3/5;
        }
        .parent8{
            display: grid;
            grid-template-columns: repeat(6,1fr);
            gap: 7px;
        }
        .parent8>*{
            background-color: aliceblue;
        }
        .parent8>.child1{
            grid-column: 1/4;
            grid-row: 1/6;
        }
        .parent8>.child2{
            grid-column: 4/6;
            grid-row: 1/4;
        }
        .parent8>.child3{
            grid-row: 1/3;
        }
        
        .parent8>.child5,.parent8>.child6,.parent8>.child7{
            grid-row: 4/6;
        }
        .parent9{
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            gap: 7px;
        }
        .parent9>*{
            background-color: aliceblue;
        }
        .parent9>.child5{
            grid-column: 1/3;
        }
        .parent9>.child6{
            grid-column: 3/5;
        }
    </style>
</head>
<body>
    <div class="main">
        <div class="parent1">
            <div class="child"></div>
            <div class="child"></div>
            <div class="child"></div>
        </div>
        <div class="parent2">
            <div class="child1"></div>
            <div class="child2"></div>
            <div class="child3"></div>
        </div>
        <div class="parent3">
            <div class="child"></div>
            <div class="child"></div>
            <div class="child"></div>
            <div class="child"></div>
            <div class="child"></div>
            <div class="child"></div>
        </div>
        <div class="parent4">
            <div class="child1"></div>
            <div class="child2"></div>
            <div class="child3"></div>
            <div class="child4"></div>
            <div class="child5"></div>
            <div class="child6"></div>
        </div>
        <div class="parent5">
            <div class="child1"></div>
            <div class="child2"></div>
            <div class="child3"></div>
            <div class="child4"></div>
            <div class="child5"></div>
        </div>
        <div class="parent6">
            <div class="child1"></div>
            <div class="child2"></div>
            <div class="child3"></div>
            <div class="child4"></div>
            <div class="child5"></div>
            <div class="child6"></div>
            
        </div>
        <div class="parent7">
            <div class="child1"></div>
            <div class="child2"></div>
            <div class="child3"></div>
            <div class="child4"></div>
            <div class="child5"></div>
        </div>
        <div class="parent8">
            <div class="child1"></div>
            <div class="child2"></div>
            <div class="child3"></div>
            <div class="child4"></div>
            <div class="child5"></div>
            <div class="child6"></div>
            <div class="child7"></div>
        </div>
        <div class="parent9">
            <div class="child1"></div>
            <div class="child2"></div>
            <div class="child3"></div>
            <div class="child4"></div>
            <div class="child5"></div>
            <div class="child6"></div>
            <div class="child7"></div>
            <div class="child8"></div>
            <div class="child9"></div>
            <div class="child10"></div>
        </div>
    </div>
</body>
</html>
